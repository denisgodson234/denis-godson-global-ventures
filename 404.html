            background: #f4f7fc;

        main {

            margin: 15px 0;
        }

            color: #666;
            margin-bottom: 25px;
        }

        .button {
            display: inline-block;
            background: #087bdf;
            color: white;
            padding: 13px 25px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
        }

        .button:hover {
            background: #005bb5;
        }

        footer {
            background: #071b3a;
            color: white;
            text-align: center;
            padding: 20px;
        }

        footer a {
            color: #64b5ff;
            text-decoration: none;
        }

        @media(max-width: 500px) {
            .error-number {
                font-size: 75px;
            }

            header h1 {

            }
        }
